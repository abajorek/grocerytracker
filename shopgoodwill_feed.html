<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf7">
  <meta name="color-scheme" content="light">
  <title>Sarah's Thrift Feed</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thrift">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter+Tight:wght@400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #fafaf7;
      --paper-2: #efeee8;
      --paper-3: #dcdbd2;
      --ink: #1c1c1a;
      --ink-soft: #5a5852;
      --hairline: rgba(28,28,26,0.10);
      --olive: #6c7559;
      --olive-deep: #525a42;
      --coral: #ff7a6b;
      --coral-deep: #e85a4a;
      --peach: #ffd5cc;
      --notice-bg: #f3f1ea;
      --notice-border: #dcdbd2;
      --success-bg: #e8ebe0;
      --success-text: #4d553e;
      --shadow: 0 8px 24px rgba(28, 28, 26, 0.08);
      --shadow-lg: 0 16px 40px rgba(28, 28, 26, 0.16);
      --serif: 'Fraunces', 'DM Serif Display', Georgia, serif;
      --sans: 'Inter Tight', 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: var(--paper); }
    body {
      font-family: var(--sans);
      color: var(--ink);
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .brand-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 30;
      padding: max(env(safe-area-inset-top), 12px) 12px 10px;
      background: linear-gradient(to bottom, rgba(250,250,247,0.96), rgba(250,250,247,0.80));
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-bottom: 1px solid var(--hairline);
      display: flex; gap: 8px; overflow-x: auto;
      scrollbar-width: none;
      align-items: center;
    }
    .brand-bar::-webkit-scrollbar { display: none; }
    .brand-bar h1 {
      font-family: var(--serif);
      font-variation-settings: 'opsz' 144;
      font-weight: 600;
      color: var(--ink);
      font-size: 24px;
      white-space: nowrap;
      margin-right: 8px;
      letter-spacing: -0.5px;
    }
    .chip {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      border: 1px solid var(--hairline);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
      font-family: inherit;
    }
    .chip:active { transform: scale(0.95); }
    .chip.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .chip.add, .chip.saved {
      background: transparent;
      color: var(--ink-soft);
      border: 1px dashed rgba(28,28,26,0.25);
    }
    .chip.saved.active {
      background: var(--coral); color: #fff;
      border-color: var(--coral-deep); border-style: solid;
    }

    .feed {
      height: 100vh; height: 100dvh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .feed::-webkit-scrollbar { display: none; }

    .card {
      position: relative;
      height: 100vh; height: 100dvh;
      width: 100vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: var(--paper-2);
      overflow: hidden;
    }
    .card-bg {
      position: absolute; inset: -8%;
      background-size: cover;
      background-position: center;
      filter: blur(48px) saturate(1.35) brightness(0.92);
      transform: scale(1.08);
      z-index: 0;
      will-change: transform;
      transition: opacity 0.35s ease;
    }
    .card-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center;
      z-index: 1;
      filter: contrast(1.04) saturate(1.06);
      image-rendering: -webkit-optimize-contrast;
      transition: opacity 0.35s ease, transform 0.2s ease;
    }
    .card-img.swapping { opacity: 0.4; }
    .card-shade {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 55%;
      background: linear-gradient(to top, rgba(28,28,26,0.85), rgba(28,28,26,0.35) 50%, transparent);
      pointer-events: none;
      z-index: 2;
    }

    .gallery-pip {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 175px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(28,28,26,0.62);
      color: #fff;
      border-radius: 999px;
      z-index: 6;
      font-family: inherit;
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      box-shadow: 0 4px 14px rgba(0,0,0,0.30);
      display: none;
      align-items: center;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
    }
    .gallery-pip.show { display: inline-flex; }
    .gallery-pip button {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 20px;
      font-weight: 500;
      padding: 9px 16px;
      cursor: pointer;
      font-family: inherit;
      line-height: 1;
      transition: background 0.12s ease;
    }
    .gallery-pip button:active { background: rgba(255,255,255,0.18); }
    .gallery-pip .count {
      padding: 0 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.6px;
      white-space: nowrap;
      opacity: 0.95;
    }

    .card-info {
      position: absolute; left: 18px; right: 84px;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 22px);
      color: #ffffff;
      z-index: 5;
    }
    .card-brand {
      font-family: var(--serif);
      font-variation-settings: 'opsz' 144;
      font-weight: 500;
      font-size: 28px;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
      line-height: 1.05;
    }
    .card-title {
      font-size: 15px;
      line-height: 1.35;
      max-height: 4.05em; overflow: hidden;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
      margin-bottom: 12px;
      opacity: 0.95;
      font-weight: 400;
    }
    .price-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .price-tag {
      background: var(--paper);
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 16px;
      box-shadow: var(--shadow);
      letter-spacing: -0.2px;
    }
    .time-tag {
      background: rgba(250,250,247,0.92);
      color: var(--ink);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }
    .time-tag.urgent { background: var(--coral-deep); color: #fff; }
    .bid-tag {
      background: rgba(28,28,26,0.85);
      color: var(--paper);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
    }

    .actions {
      position: absolute;
      right: 14px;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 22px);
      display: flex; flex-direction: column; gap: 14px;
      align-items: center;
      z-index: 5;
    }
    .action-btn {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(250,250,247,0.95);
      color: var(--ink);
      border: none;
      font-size: 22px;
      display: grid; place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform 0.15s ease, background 0.2s ease;
      font-family: inherit;
    }
    .action-btn:active { transform: scale(0.92); }
    .action-btn.fav.active { background: var(--coral); color: #fff; }

    .burst {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 110px;
      color: var(--coral);
      pointer-events: none;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.45));
      z-index: 8;
      opacity: 0;
    }
    .burst.go { animation: burst 720ms ease-out forwards; }
    @keyframes burst {
      0%   { transform: translate(-50%,-50%) scale(0.2); opacity: 0; }
      30%  { transform: translate(-50%,-50%) scale(1.25); opacity: 1; }
      80%  { transform: translate(-50%,-50%) scale(1.0); opacity: 0.9; }
      100% { transform: translate(-50%,-50%) scale(0.7); opacity: 0; }
    }

    .swipe-overlay {
      position: absolute;
      top: 50%;
      padding: 18px 30px;
      border-radius: 999px;
      font-family: var(--serif);
      font-variation-settings: 'opsz' 144;
      font-weight: 500;
      font-size: 26px;
      color: #fff;
      pointer-events: none;
      z-index: 9;
      opacity: 0;
      transform: translateY(-50%) scale(0.7);
      transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: var(--shadow-lg);
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .swipe-overlay.save { left: 24px; background: var(--coral); border: 2px solid var(--coral-deep); }
    .swipe-overlay.bid  { right: 24px; background: var(--olive); border: 2px solid var(--olive-deep); }
    .swipe-overlay.show { opacity: 1; transform: translateY(-50%) scale(1); }
    .swipe-overlay.peek { opacity: 0.7; }

    .drawer-bg, .modal-bg {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(28,28,26,0.55);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .drawer-bg.open, .modal-bg.open { opacity: 1; pointer-events: auto; }
    .modal-bg { display: grid; place-items: end center; padding: 0; }
    .modal-bg.open { display: grid; }
    @media (min-height: 700px) { .modal-bg { place-items: center; padding: 24px; } }

    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(420px, 88vw);
      background: var(--paper);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 41;
      overflow-y: auto;
      padding: 22px 22px calc(env(safe-area-inset-bottom, 24px) + 24px);
      color: var(--ink);
    }
    .drawer.open { transform: translateX(0); }
    .drawer-handle {
      width: 40px; height: 4px; background: var(--paper-3);
      border-radius: 4px; margin: 0 auto 18px;
    }
    .drawer h2 {
      font-family: var(--serif);
      font-variation-settings: 'opsz' 144;
      font-weight: 500;
      font-size: 28px;
      color: var(--ink);
      margin-bottom: 6px;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }
    .pill {
      display: inline-block;
      background: var(--coral);
      color: #fff;
      padding: 4px 12px;
      border-radius: 999px;
      border: none;
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 14px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .row {
      display: flex; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--hairline);
      font-size: 14px;
    }
    .row b { color: var(--ink); font-weight: 600; }
    .row span { color: var(--ink-soft); }
    .drawer-actions { margin-top: 22px; display: flex; gap: 10px; }
    .drawer-actions a, .drawer-actions button {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: var(--ink); color: var(--paper); }
    .btn-primary:disabled { background: var(--paper-2); color: var(--ink-soft); cursor: not-allowed; }
    .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--hairline) !important; }

    .center-msg {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      color: var(--ink);
      text-align: center;
      padding: 24px;
      z-index: 3;
    }
    .center-msg h3 {
      font-family: var(--serif);
      font-variation-settings: 'opsz' 144;
      font-weight: 500;
      font-size: 32px; margin-bottom: 10px;
      color: var(--ink);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .center-msg p { color: var(--ink-soft); max-width: 320px; line-height: 1.45; }
    .dots { margin-top: 14px; display: inline-flex; gap: 6px; }
    .dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--coral);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-8px); opacity: 1; }
    }

    .modal {
      background: var(--paper);
      border-radius: 18px 18px 0 0;
      padding: 24px 22px calc(env(safe-area-inset-bottom, 24px) + 24px);
      max-width: 460px; width: 100%;
      box-shadow: var(--shadow-lg);
      max-height: 92vh;
      overflow-y: auto;
      color: var(--ink);
    }
    @media (min-height: 700px) { .modal { border-radius: 18px; padding: 24px; } }
    .modal h3 {
      font-family: var(--serif);
      font-variation-settings: 'opsz' 144;
      font-weight: 500;
      font-size: 28px;
      margin-bottom: 6px;
      color: var(--ink);
      letter-spacing: -0.5px;
    }
    .modal-sub {
      color: var(--ink-soft);
      font-size: 13px;
      margin-bottom: 16px;
    }
    .modal input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--hairline);
      font-size: 15px;
      margin-bottom: 14px;
      background: var(--paper);
      color: var(--ink);
      font-family: inherit;
    }
    .modal input:focus { outline: 1.5px solid var(--coral); outline-offset: 1px; border-color: transparent; }
    .modal-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .modal-list .chip { background: transparent; color: var(--ink); border: 1px solid var(--hairline); }
    .modal-list .chip .x { margin-left: 6px; opacity: 0.5; font-weight: 600; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-actions button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    .bid-thumb-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px;
      background: var(--paper-2);
      border-radius: 14px;
      align-items: center;
    }
    .bid-thumb-row img {
      width: 56px; height: 56px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .bid-thumb-row > div { flex: 1; min-width: 0; }
    .bid-title-text {
      font-size: 14px; font-weight: 600; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bid-current-text {
      font-size: 12px; color: var(--ink-soft); margin-top: 2px;
    }
    .bid-presets {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .bid-preset {
      padding: 14px 12px;
      border-radius: 12px;
      border: 1px solid var(--hairline);
      background: var(--paper);
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      text-align: left;
    }
    .bid-preset .label {
      display: block;
      font-size: 10px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .bid-preset:active { transform: scale(0.97); }
    .bid-preset.selected {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .bid-preset.selected .label { color: rgba(250,250,247,0.7); }

    .bid-notice {
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 12px;
      min-height: 0;
      color: var(--ink);
    }
    .bid-notice:empty { margin-bottom: 0; }
    .bid-notice.show {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--notice-bg);
      border: 1px solid var(--notice-border);
    }
    .bid-notice.success {
      background: var(--success-bg);
      border-color: #c4ccb6;
      color: var(--success-text);
    }

    @media (max-width: 380px) {
      .card-info { right: 76px; }
      .card-brand { font-size: 24px; }
      .gallery-pip { bottom: calc(env(safe-area-inset-bottom, 16px) + 165px); }
    }
  </style>
</head>
<body>
  <div class="brand-bar" id="brandBar">
    <h1>Thrift</h1>
  </div>

  <div class="feed" id="feed">
    <div class="card">
      <div class="center-msg">
        <div>
          <h3>Pick a brand</h3>
          <p>Tap a chip up top to start. Flick up for the next find. Swipe right to save · swipe left to bid.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-handle"></div>
    <div id="drawerContent"></div>
  </aside>

  <div class="modal-bg" id="brandModalBg">
    <div class="modal">
      <h3>Pin your brands</h3>
      <div class="modal-list" id="brandList"></div>
      <input id="brandInput" placeholder="Add a brand (Coach, Madewell…)" autocomplete="off">
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeBrandModal()">Done</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="bidModalBg">
    <div class="modal">
      <h3>Place a bid</h3>
      <div class="modal-sub">Pick an amount or type your own.</div>
      <div class="bid-thumb-row">
        <img id="bidThumb" alt="">
        <div>
          <div class="bid-title-text" id="bidTitle"></div>
          <div class="bid-current-text" id="bidCurrent"></div>
        </div>
      </div>
      <div class="bid-presets" id="bidPresets"></div>
      <input id="bidCustom" type="number" inputmode="decimal" step="0.01" placeholder="Custom amount">
      <div class="bid-notice" id="bidNotice"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeBidModal()">Cancel</button>
        <button class="btn-primary" id="bidConfirm" disabled>Place bid</button>
      </div>
    </div>
  </div>

  <script>
    const SWIPE_THRESHOLD = 70;
    const SWIPE_VERTICAL_TOLERANCE = 60;
    const SWIPE_PEEK_DISTANCE = 30;

    const state = {
      brands: [],
      activeBrand: null,
      page: 1,
      items: [],
      favorites: new Set(),
      mode: 'feed',
      loading: false,
      exhausted: false,
    };

    const galleryCache = new Map(); // itemId -> { images: [...], index: 0 }
    const detailFetched = new Set(); // itemIds already fetched (success or fail)

    const fmtPrice = n => `$${(Number(n) || 0).toFixed(2)}`;
    const isUrgent = s => s > 0 && s < 3600;
    function fmtTime(seconds) {
      if (!Number.isFinite(seconds) || seconds <= 0) return 'Ended';
      const d = Math.floor(seconds / 86400);
      const h = Math.floor((seconds % 86400) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      if (d > 0) return `${d}d ${h}h left`;
      if (h > 0) return `${h}h ${m}m left`;
      return `${Math.max(1, m)}m left`;
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function safeUrlForCss(u) {
      return encodeURI(u || '').replace(/'/g, '%27');
    }

    function setBidNotice(text, kind) {
      const el = document.getElementById('bidNotice');
      el.textContent = text || '';
      el.classList.remove('success', 'show');
      if (text) {
        el.classList.add('show');
        if (kind === 'success') el.classList.add('success');
      }
    }

    async function apiGet(path) {
      const r = await fetch(path);
      if (!r.ok) {
        let detail = String(r.status);
        try { const j = await r.json(); if (j && j.detail) detail = j.detail; } catch {}
        throw new Error(`GET ${path} → ${detail}`);
      }
      return r.json();
    }
    async function apiSend(path, method, body) {
      const r = await fetch(path, {
        method,
        headers: {'Content-Type': 'application/json'},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!r.ok) {
        let detail = String(r.status);
        try { const j = await r.json(); if (j && j.detail) detail = j.detail; } catch {}
        throw new Error(detail);
      }
      return r.json();
    }

    function warmingCard(brand) {
      return `
        <div class="card">
          <div class="center-msg">
            <div>
              <h3>Warming up…</h3>
              <p>The free server takes about 30 seconds to wake from a nap.
              ${brand ? `${escapeHtml(brand)} finds will appear here as soon as it stretches.` : ''}</p>
              <div class="dots"><span></span><span></span><span></span></div>
            </div>
          </div>
        </div>`;
    }

    async function loadBrands() {
      try { state.brands = await apiGet('/api/brands'); }
      catch { state.brands = ['Coach', 'Madewell', 'Patagonia', 'J.Crew', 'Free People']; }
      renderBrandBar();
      renderBrandModal();
    }
    async function saveBrands() {
      try { state.brands = await apiSend('/api/brands', 'POST', state.brands); }
      catch (e) { console.warn('save brands failed', e); }
      renderBrandBar();
      renderBrandModal();
    }

    function renderBrandBar() {
      const bar = document.getElementById('brandBar');
      bar.innerHTML = '<h1>Thrift</h1>';
      state.brands.forEach(b => {
        const c = document.createElement('button');
        c.className = 'chip' + (state.mode === 'feed' && b === state.activeBrand ? ' active' : '');
        c.textContent = b;
        c.onclick = () => selectBrand(b);
        bar.appendChild(c);
      });
      const add = document.createElement('button');
      add.className = 'chip add';
      add.textContent = '+ pin';
      add.onclick = openBrandModal;
      bar.appendChild(add);
      const sav = document.createElement('button');
      sav.className = 'chip saved' + (state.mode === 'saved' ? ' active' : '');
      sav.innerHTML = '♡ saved';
      sav.onclick = showFavorites;
      bar.appendChild(sav);
    }

    async function selectBrand(brand) {
      state.activeBrand = brand;
      state.mode = 'feed';
      state.page = 1;
      state.items = [];
      state.exhausted = false;
      renderBrandBar();
      document.getElementById('feed').innerHTML = `
        <div class="card">
          <div class="center-msg">
            <div>
              <h3>Pulling ${escapeHtml(brand)} finds…</h3>
              <p>Flick up for next · → to save · ← to bid</p>
              <div class="dots"><span></span><span></span><span></span></div>
            </div>
          </div>
        </div>`;
      await loadMore();
    }

    async function loadMore() {
      if (state.mode !== 'feed' || !state.activeBrand || state.loading || state.exhausted) return;
      state.loading = true;
      let warmTimer = null;
      if (state.items.length === 0) {
        warmTimer = setTimeout(() => {
          document.getElementById('feed').innerHTML = warmingCard(state.activeBrand);
        }, 4000);
      }
      try {
        const items = await apiGet(`/api/feed?brand=${encodeURIComponent(state.activeBrand)}&page=${state.page}`);
        if (warmTimer) clearTimeout(warmTimer);
        if (!items.length) state.exhausted = true;
        state.items.push(...items);
        state.page += 1;
        renderFeed();
      } catch (e) {
        if (warmTimer) clearTimeout(warmTimer);
        renderError(e);
      } finally {
        state.loading = false;
      }
    }

    function renderFeed() {
      const feed = document.getElementById('feed');
      if (state.items.length === 0) {
        feed.innerHTML = `
          <div class="card">
            <div class="center-msg">
              <div><h3>No ${escapeHtml(state.activeBrand)} listings</h3>
              <p>Try another pinned brand or check back soon.</p></div>
            </div>
          </div>`;
        return;
      }
      feed.innerHTML = state.items.map(cardHTML).join('');
      feed.querySelectorAll('.card[data-id]').forEach(card => {
        attachGestures(card);
        detailObserver.observe(card);
        // Apply any cached gallery (e.g. on re-render)
        const id = parseInt(card.dataset.id, 10);
        if (galleryCache.has(id)) applyGallery(card, id);
      });
      observeLastCard();
    }

    function cardHTML(it, idx) {
      const saved = state.favorites.has(it.id);
      const heart = saved ? '♥' : '♡';
      const heartCls = saved ? 'action-btn fav active' : 'action-btn fav';
      const urgent = isUrgent(it.seconds_left) ? ' urgent' : '';
      const safeUrl = safeUrlForCss(it.image_url);
      return `
        <article class="card" data-idx="${idx}" data-id="${it.id}">
          <div class="card-bg" style="background-image:url('${safeUrl}');"></div>
          <img class="card-img" src="${escapeHtml(it.image_url)}" alt="" loading="${idx < 2 ? 'eager' : 'lazy'}" decoding="async" onerror="this.removeAttribute('src');">
          <div class="gallery-pip" data-pip>
            <button data-pip-prev aria-label="Previous photo">‹</button>
            <span class="count" data-pip-text>1 / 1</span>
            <button data-pip-next aria-label="Next photo">›</button>
          </div>
          <div class="card-shade"></div>
          <div class="burst" data-burst>♥</div>
          <div class="swipe-overlay save" data-overlay-save>♥ saved</div>
          <div class="swipe-overlay bid"  data-overlay-bid>↗ bid</div>
          <div class="card-info">
            <div class="card-brand">${escapeHtml(it.brand)}</div>
            <div class="card-title">${escapeHtml(it.title)}</div>
            <div class="price-row">
              <span class="price-tag">${fmtPrice(it.current_price)}</span>
              <span class="time-tag${urgent}" data-time="${it.seconds_left}">${fmtTime(it.seconds_left)}</span>
              ${it.bid_count ? `<span class="bid-tag">${it.bid_count} bid${it.bid_count === 1 ? '' : 's'}</span>` : ''}
            </div>
          </div>
          <div class="actions">
            <button class="${heartCls}" data-fav aria-label="Save">${heart}</button>
            <button class="action-btn" data-info aria-label="Details">i</button>
            <button class="action-btn" data-bid aria-label="Bid">$</button>
          </div>
        </article>`;
    }

    function renderError(e) {
      document.getElementById('feed').innerHTML = `
        <div class="card">
          <div class="center-msg">
            <div><h3>Couldn't load</h3>
            <p>${escapeHtml(e && e.message || e)}</p></div>
          </div>
        </div>`;
    }

    function attachGestures(card) {
      const id = parseInt(card.dataset.id, 10);
      const item = state.items.find(x => x.id === id);
      if (!item) return;
      const burst = card.querySelector('[data-burst]');
      const img = card.querySelector('.card-img');
      const overlaySave = card.querySelector('[data-overlay-save]');
      const overlayBid  = card.querySelector('[data-overlay-bid]');

      let lastTap = 0;
      card.addEventListener('click', (e) => {
        if (e.target.closest('button,a')) return;
        const now = Date.now();
        if (now - lastTap < 320) {
          if (!state.favorites.has(item.id)) toggleFav(item, card);
          fireBurst(burst);
        }
        lastTap = now;
      });

      let startX = 0, startY = 0, tracking = false, horizontal = false;
      card.addEventListener('touchstart', (e) => {
        if (e.target.closest('button,a')) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        tracking = true;
        horizontal = false;
      }, { passive: true });

      card.addEventListener('touchmove', (e) => {
        if (!tracking) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (!horizontal && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
          horizontal = true;
        }
        if (!horizontal) return;
        const peek = Math.max(-1, Math.min(1, dx / 140));
        if (img) img.style.transform = `translateX(${dx * 0.18}px)`;
        if (dx > SWIPE_PEEK_DISTANCE) {
          overlaySave.classList.add('peek');
          overlaySave.style.opacity = String(Math.min(0.9, peek));
          overlayBid.classList.remove('peek', 'show');
          overlayBid.style.opacity = '';
        } else if (dx < -SWIPE_PEEK_DISTANCE) {
          overlayBid.classList.add('peek');
          overlayBid.style.opacity = String(Math.min(0.9, -peek));
          overlaySave.classList.remove('peek', 'show');
          overlaySave.style.opacity = '';
        } else {
          overlaySave.classList.remove('peek', 'show');
          overlayBid.classList.remove('peek', 'show');
          overlaySave.style.opacity = '';
          overlayBid.style.opacity = '';
        }
      }, { passive: true });

      card.addEventListener('touchend', (e) => {
        if (!tracking) return;
        tracking = false;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;

        if (img) img.style.transform = '';
        overlaySave.classList.remove('peek');
        overlayBid.classList.remove('peek');
        overlaySave.style.opacity = '';
        overlayBid.style.opacity = '';

        if (Math.abs(dy) > SWIPE_VERTICAL_TOLERANCE) return;

        if (dx > SWIPE_THRESHOLD) {
          if (!state.favorites.has(item.id)) toggleFav(item, card);
          fireBurst(burst);
          flashOverlay(overlaySave);
        } else if (dx < -SWIPE_THRESHOLD) {
          flashOverlay(overlayBid);
          setTimeout(() => openBidSheet(item), 180);
        }
      }, { passive: true });

      card.querySelector('[data-fav]').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFav(item, card);
      });
      card.querySelector('[data-info]').addEventListener('click', (e) => {
        e.stopPropagation();
        openDrawer(item);
      });
      card.querySelector('[data-bid]').addEventListener('click', (e) => {
        e.stopPropagation();
        openBidSheet(item);
      });
      const pipPrev = card.querySelector('[data-pip-prev]');
      const pipNext = card.querySelector('[data-pip-next]');
      if (pipPrev) {
        pipPrev.addEventListener('click', (e) => {
          e.stopPropagation();
          advanceGallery(card, id, -1);
        });
      }
      if (pipNext) {
        pipNext.addEventListener('click', (e) => {
          e.stopPropagation();
          advanceGallery(card, id, 1);
        });
      }
    }

    function fireBurst(el) {
      el.classList.remove('go');
      void el.offsetWidth;
      el.classList.add('go');
    }

    function flashOverlay(el) {
      el.classList.remove('peek');
      el.style.opacity = '';
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 650);
    }

    // ----- gallery (lazy fetch full-resolution images per card) -----

    const detailObserver = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const id = parseInt(e.target.dataset.id, 10);
          if (id && !detailFetched.has(id)) fetchDetailFor(e.target, id);
        }
      });
    }, { threshold: 0.6 });

    async function fetchDetailFor(card, itemId) {
      detailFetched.add(itemId);
      try {
        const data = await apiGet(`/api/item/${itemId}`);
        const images = (data && data.images) || [];
        if (!images.length) return;
        galleryCache.set(itemId, { images, index: 0 });
        applyGallery(card, itemId);
      } catch (e) {
        // Detail fetch is best-effort; silently leave the search-API image in place.
        console.warn('detail fetch failed', itemId, e);
      }
    }

    function applyGallery(card, itemId) {
      const entry = galleryCache.get(itemId);
      if (!entry || !entry.images.length) return;
      swapCardImage(card, entry.images[entry.index]);
      updatePip(card, entry);
    }

    function swapCardImage(card, url) {
      if (!url) return;
      const img = card.querySelector('.card-img');
      const bg = card.querySelector('.card-bg');
      if (!img) return;
      if (img.src === url) return;
      const pre = new Image();
      img.classList.add('swapping');
      pre.onload = () => {
        img.src = url;
        if (bg) bg.style.backgroundImage = `url('${safeUrlForCss(url)}')`;
        requestAnimationFrame(() => img.classList.remove('swapping'));
      };
      pre.onerror = () => img.classList.remove('swapping');
      pre.src = url;
    }

    function updatePip(card, entry) {
      const pip = card.querySelector('[data-pip]');
      if (!pip) return;
      if (!entry || entry.images.length < 2) {
        pip.classList.remove('show');
        return;
      }
      const text = pip.querySelector('[data-pip-text]');
      if (text) text.textContent = `${entry.index + 1} / ${entry.images.length}`;
      pip.classList.add('show');
    }

    function advanceGallery(card, itemId, dir) {
      const entry = galleryCache.get(itemId);
      if (!entry || entry.images.length < 2) return;
      const n = entry.images.length;
      const step = dir || 1;
      entry.index = ((entry.index + step) % n + n) % n;
      swapCardImage(card, entry.images[entry.index]);
      updatePip(card, entry);
    }

    async function toggleFav(item, card) {
      const btn = card && card.querySelector('[data-fav]');
      if (state.favorites.has(item.id)) {
        state.favorites.delete(item.id);
        if (btn) { btn.classList.remove('active'); btn.textContent = '♡'; }
        try { await fetch(`/api/favorites/${item.id}`, { method: 'DELETE' }); } catch (e) { console.warn(e); }
      } else {
        state.favorites.add(item.id);
        if (btn) { btn.classList.add('active'); btn.textContent = '♥'; }
        try {
          await apiSend('/api/favorites', 'POST', {
            item_id: item.id,
            title: item.title,
            image_url: item.image_url,
            listing_url: item.listing_url,
            brand: item.brand,
            saved_at: new Date().toISOString(),
          });
        } catch (e) { console.warn(e); }
      }
    }

    async function loadFavorites() {
      try {
        const favs = await apiGet('/api/favorites');
        state.favorites = new Set(favs.map(f => f.item_id));
      } catch {}
    }

    async function showFavorites() {
      state.mode = 'saved';
      renderBrandBar();
      try {
        const favs = await apiGet('/api/favorites');
        const feed = document.getElementById('feed');
        if (!favs.length) {
          feed.innerHTML = `<div class="card"><div class="center-msg"><div><h3>Nothing saved yet</h3><p>Swipe a card right to save it here.</p></div></div></div>`;
          return;
        }
        feed.innerHTML = favs.map((f, idx) => {
          const safeUrl = safeUrlForCss(f.image_url);
          return `
          <article class="card">
            <div class="card-bg" style="background-image:url('${safeUrl}');"></div>
            <img class="card-img" src="${escapeHtml(f.image_url)}" alt="" loading="${idx < 2 ? 'eager' : 'lazy'}" decoding="async" onerror="this.removeAttribute('src');">
            <div class="card-shade"></div>
            <div class="card-info">
              <div class="card-brand">${escapeHtml(f.brand || 'Saved')}</div>
              <div class="card-title">${escapeHtml(f.title)}</div>
              <div class="price-row">
                <a class="price-tag" href="${escapeHtml(f.listing_url)}" target="_blank" rel="noopener" style="text-decoration:none;">Open ↗</a>
              </div>
            </div>
          </article>`;
        }).join('');
      } catch (e) {
        renderError(e);
      }
    }

    function openDrawer(item) {
      const c = document.getElementById('drawerContent');
      c.innerHTML = `
        <span class="pill">${escapeHtml(item.brand)}</span>
        <h2>${escapeHtml(item.title)}</h2>
        <div class="row"><b>Current bid</b><span>${fmtPrice(item.current_price)}</span></div>
        <div class="row"><b>Minimum next bid</b><span>${fmtPrice(item.minimum_bid)}</span></div>
        <div class="row"><b>Bids placed</b><span>${item.bid_count || 0}</span></div>
        <div class="row"><b>Time left</b><span>${fmtTime(item.seconds_left)}</span></div>
        ${item.location ? `<div class="row"><b>Seller</b><span>${escapeHtml(item.location)}</span></div>` : ''}
        <div class="drawer-actions">
          <button class="btn-primary" onclick="closeDrawer(); openBidSheet(${JSON.stringify(item).replace(/"/g, '&quot;')})">Bid</button>
          <button class="btn-secondary" onclick="closeDrawer()">Close</button>
        </div>`;
      document.getElementById('drawer').classList.add('open');
      document.getElementById('drawer').setAttribute('aria-hidden', 'false');
      document.getElementById('drawerBg').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawer').setAttribute('aria-hidden', 'true');
      document.getElementById('drawerBg').classList.remove('open');
    }
    document.getElementById('drawerBg').addEventListener('click', closeDrawer);

    function openBrandModal() {
      renderBrandModal();
      document.getElementById('brandModalBg').classList.add('open');
      setTimeout(() => document.getElementById('brandInput').focus(), 50);
    }
    function closeBrandModal() {
      document.getElementById('brandModalBg').classList.remove('open');
    }
    function renderBrandModal() {
      const list = document.getElementById('brandList');
      list.innerHTML = state.brands.map(b => `
        <button class="chip" data-b="${escapeHtml(b)}">${escapeHtml(b)} <span class="x">×</span></button>
      `).join('');
      list.querySelectorAll('.chip').forEach(el => {
        el.onclick = () => {
          const b = el.dataset.b;
          state.brands = state.brands.filter(x => x !== b);
          if (state.activeBrand === b) state.activeBrand = null;
          saveBrands();
        };
      });
      const inp = document.getElementById('brandInput');
      inp.onkeydown = (e) => {
        if (e.key === 'Enter' && inp.value.trim()) {
          const b = inp.value.trim();
          if (!state.brands.includes(b)) state.brands.push(b);
          inp.value = '';
          saveBrands();
        }
      };
    }

    // ----- bid sheet -----

    let bidContext = null;

    function openBidSheet(item) {
      bidContext = { item, amount: null };
      document.getElementById('bidThumb').src = item.image_url;
      document.getElementById('bidTitle').textContent = item.title;
      document.getElementById('bidCurrent').textContent =
        `Current ${fmtPrice(item.current_price)} · min next ${fmtPrice(item.minimum_bid)}`;

      const min = Math.max(item.minimum_bid, item.current_price + 1);
      const presets = [
        { label: 'Min',     amount: min },
        { label: 'Min +$1', amount: min + 1 },
        { label: 'Min +$5', amount: min + 5 },
        { label: 'Min +$10', amount: min + 10 },
      ];
      const presetsEl = document.getElementById('bidPresets');
      presetsEl.innerHTML = presets.map(p => `
        <button class="bid-preset" data-amount="${p.amount}">
          <span class="label">${escapeHtml(p.label)}</span>
          ${fmtPrice(p.amount)}
        </button>
      `).join('');
      presetsEl.querySelectorAll('.bid-preset').forEach(btn => {
        btn.onclick = () => selectBidAmount(parseFloat(btn.dataset.amount), btn);
      });

      const custom = document.getElementById('bidCustom');
      custom.value = '';
      custom.placeholder = `Custom amount (e.g. ${(min + 2.50).toFixed(2)})`;
      custom.oninput = () => {
        const v = parseFloat(custom.value);
        if (Number.isFinite(v) && v > 0) {
          bidContext.amount = v;
          presetsEl.querySelectorAll('.bid-preset').forEach(b => b.classList.remove('selected'));
          document.getElementById('bidConfirm').disabled = false;
        } else {
          if (!presetsEl.querySelector('.bid-preset.selected')) {
            document.getElementById('bidConfirm').disabled = true;
            bidContext.amount = null;
          }
        }
      };

      setBidNotice('');
      const confirmBtn = document.getElementById('bidConfirm');
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Place bid';
      document.getElementById('bidModalBg').classList.add('open');
    }

    function selectBidAmount(amount, btnEl) {
      bidContext.amount = amount;
      document.querySelectorAll('.bid-preset').forEach(b => b.classList.remove('selected'));
      if (btnEl) btnEl.classList.add('selected');
      document.getElementById('bidCustom').value = '';
      document.getElementById('bidConfirm').disabled = false;
    }

    function closeBidModal() {
      document.getElementById('bidModalBg').classList.remove('open');
      bidContext = null;
    }

    document.getElementById('bidConfirm').onclick = async () => {
      if (!bidContext || !bidContext.amount) return;
      const btn = document.getElementById('bidConfirm');
      btn.disabled = true;
      btn.textContent = 'Placing…';
      setBidNotice('');
      try {
        await apiSend('/api/bid', 'POST', {
          item_id: bidContext.item.id,
          amount: bidContext.amount,
        });
        btn.textContent = 'Bid placed ✓';
        setBidNotice(`Bid of ${fmtPrice(bidContext.amount)} submitted.`, 'success');
        setTimeout(closeBidModal, 1400);
      } catch (e) {
        setBidNotice(e.message || String(e));
        btn.disabled = false;
        btn.textContent = 'Place bid';
      }
    };

    document.getElementById('bidModalBg').addEventListener('click', (e) => {
      if (e.target.id === 'bidModalBg') closeBidModal();
    });
    document.getElementById('brandModalBg').addEventListener('click', (e) => {
      if (e.target.id === 'brandModalBg') closeBrandModal();
    });

    let observer;
    function observeLastCard() {
      if (observer) observer.disconnect();
      const cards = document.querySelectorAll('.card[data-id]');
      if (cards.length < 2) return;
      observer = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) loadMore(); });
      }, { threshold: 0.3 });
      observer.observe(cards[cards.length - 2]);
    }

    setInterval(() => {
      document.querySelectorAll('[data-time]').forEach(el => {
        let s = parseInt(el.dataset.time, 10);
        if (!Number.isFinite(s)) return;
        s = Math.max(0, s - 1);
        el.dataset.time = s;
        el.textContent = fmtTime(s);
        if (isUrgent(s)) el.classList.add('urgent');
      });
    }, 1000);

    (async function init() {
      await loadFavorites();
      await loadBrands();
    })();
  </script>
</body>
</html>
